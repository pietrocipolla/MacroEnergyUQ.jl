name: Tests and coverage

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Julia ${{ matrix.julia-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - julia-version: "1.10"
            coverage: false
          - julia-version: "1"
            coverage: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R test dependency
        shell: Rscript {0}
        run: install.packages("transport")

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia-version }}

      - name: Cache Julia packages
        uses: julia-actions/cache@v3
        with:
          delete-old-caches: false

      - name: Configure RCall
        shell: julia --color=yes {0}
        run: |
          using Pkg
          Pkg.activate(; temp=true)
          Pkg.add(PackageSpec(name="RCall", version="0.14"))
          Pkg.build("RCall")

      - name: Build package
        uses: julia-actions/julia-buildpkg@v1

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        with:
          coverage: ${{ matrix.coverage }}

      - name: Create LCOV report
        if: matrix.coverage
        uses: julia-actions/julia-processcoverage@v1

      - name: Save coverage report
        if: matrix.coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: matrix.coverage
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          disable_search: true
          fail_ci_if_error: false
          use_oidc: true

      - name: Remove temporary coverage files
        if: ${{ always() && matrix.coverage }}
        shell: bash
        run: find src ext test -type f -name '*.cov' -delete
